<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clear — Live Playground</title>
<meta name="description" content="Try Clear in your browser. Write .clear code and see instant REST API + Web UI output.">
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="playground.css">
<style>
nav{background:#0b1120;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100}
nav .logo{font-weight:800;font-size:18px;color:var(--text);text-decoration:none}
nav .logo span{color:var(--primary)}
nav .links{margin-left:auto;display:flex;gap:16px;align-items:center}
nav .links a{color:var(--text-muted);text-decoration:none;font-size:13px;font-weight:500}
nav .links a:hover{color:var(--text)}
nav .star-btn{background:var(--primary);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;font-weight:600;text-decoration:none}
.playground-hero{background:linear-gradient(135deg,#0f172a,#1e293b);padding:40px 24px 30px;text-align:center}
.playground-hero h1{font-size:32px;font-weight:800;margin-bottom:6px}
.playground-hero h1 span{color:var(--primary)}
.playground-hero p{color:var(--text-muted);font-size:15px}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Clear<span>.</span></a>
  <div class="links">
    <a href="guide/getting-started.md">Docs</a>
    <a href="guide/language.md">Language</a>
    <a href="guide/cli.md">CLI</a>
    <a href="guide/examples.md">Examples</a>
    <a href="https://github.com/varshinicb1/clear2.0">GitHub</a>
    <a href="https://npmjs.com/package/varshinicb-clear">npm</a>
    <a href="index.html" class="star-btn">Home</a>
  </div>
</nav>

<div class="playground-hero">
  <h1>Live <span>Playground</span></h1>
  <p>Pick an example. See the .clear code on the left and what it generates on the right.</p>
</div>

<div id="playground"></div>

<div style="text-align:center;padding:40px 24px">
  <h2 style="font-size:22px;margin-bottom:12px">Try it on your machine</h2>
  <p style="color:var(--text-muted);margin-bottom:20px">Create a file and run:</p>
  <div class="install-cmd" style="display:inline-block;font-size:13px">npx -p varshinicb-clear clear-cli run app.clear</div>
</div>

<div class="footer">
  <p><a href="https://github.com/varshinicb1/clear2.0">GitHub</a> · <a href="https://npmjs.com/package/varshinicb-clear">npm</a> · MIT License</p>
