<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <rect width="720" height="260" fill="#0f172a" rx="10"/>
  <rect x="0" y="0" width="720" height="32" rx="10" fill="#1e293b"/>
  <rect x="0" y="16" width="720" height="16" fill="#1e293b"/>

  <!-- Window dots -->
  <circle cx="20" cy="16" r="5" fill="#ef4444"/>
  <circle cx="38" cy="16" r="5" fill="#eab308"/>
  <circle cx="56" cy="16" r="5" fill="#22c55e"/>
  <text x="350" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">terminal</text>

  <!-- Terminal content -->
  <g font-family="'Courier New', monospace" font-size="13">
    <!-- prompt -->
    <text x="20" y="60" fill="#4ade80">$</text>
    <text x="35" y="60" fill="#e2e8f0">clear-cli run app.clear</text>

    <!-- output line 1 -->
    <text x="20" y="88" fill="#64748b">╭─ Clear v0.4.3 ─────────────────────────╮</text>

    <!-- output line 2 -->
    <text x="20" y="112" fill="#64748b">│</text>
    <text x="28" y="112" fill="#60a5fa">REST API:</text>
    <text x="110" y="112" fill="#4ade80">http://localhost:8080/api</text>
    <text x="320" y="112" fill="#64748b">│</text>

    <!-- output line 3 -->
    <text x="20" y="134" fill="#64748b">│</text>
    <text x="28" y="134" fill="#60a5fa">Web UI:</text>
    <text x="110" y="134" fill="#34d399">http://localhost:8080/s/dashboard</text>
    <text x="340" y="134" fill="#64748b">│</text>

    <!-- output line 4 -->
    <text x="20" y="156" fill="#64748b">│</text>
    <text x="28" y="156" fill="#94a3b8">Auto-CRUD:</text>
    <text x="130" y="156" fill="#93c5fd">GET</text>
    <text x="175" y="156" fill="#93c5fd">POST</text>
    <text x="220" y="156" fill="#93c5fd">PUT</text>
    <text x="255" y="156" fill="#93c5fd">DELETE</text>
    <text x="310" y="156" fill="#94a3b8">Filter · Sort · Paginate</text>
    <text x="480" y="156" fill="#64748b">│</text>

    <!-- output line 5 -->
    <text x="20" y="178" fill="#64748b">│</text>
    <text x="28" y="178" fill="#94a3b8">Auth:</text>
    <text x="80" y="178" fill="#fbbf24">Default</text>
    <text x="145" y="178" fill="#94a3b8">Persistence:</text>
    <text x="250" y="178" fill="#4ade80">enabled</text>
    <text x="320" y="178" fill="#64748b">│</text>

    <!-- output line 6 -->
    <text x="20" y="200" fill="#64748b">│</text>
    <text x="28" y="200" fill="#94a3b8">Screens:</text>
    <text x="100" y="200" fill="#34d399">/s/dashboard</text>
    <text x="217" y="200" fill="#94a3b8">Watcher:</text>
    <text x="290" y="200" fill="#4ade80">active</text>
    <text x="340" y="200" fill="#64748b">│</text>

    <!-- output line 7 -->
    <text x="20" y="228" fill="#64748b">│</text>
    <text x="28" y="228" fill="#64748b">Server running on port 8080</text>
    <text x="228" y="228" fill="#fbbf24">●</text>
    <text x="320" y="228" fill="#64748b">│</text>

    <!-- output line 8 -->
    <text x="20" y="248" fill="#64748b">╰──────────────────────────────────────────╯</text>
  </g>
</svg>
