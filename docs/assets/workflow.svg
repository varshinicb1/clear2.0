<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="#0f172a" rx="12"/>

  <!-- Box 1: Write -->
  <rect x="20" y="25" width="150" height="70" rx="10" fill="url(#box1)" stroke="#334155" stroke-width="1"/>
  <text x="95" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">&#128221;</text>
  <text x="95" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Write .clear file</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="60" x2="230" y2="60" stroke="url(#arrow)" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="228,54 238,60 228,66" fill="#22d3ee"/>

  <!-- Box 2: Parse -->
  <rect x="240" y="25" width="130" height="70" rx="10" fill="url(#box1)" stroke="#334155" stroke-width="1"/>
  <text x="305" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">&#9889;</text>
  <text x="305" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Parse + Validate</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="60" x2="430" y2="60" stroke="url(#arrow)" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="428,54 438,60 428,66" fill="#22d3ee"/>

  <!-- Box 3: Run -->
  <rect x="440" y="25" width="150" height="70" rx="10" fill="url(#box2)" stroke="none"/>
  <text x="515" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">&#9654;</text>
  <text x="515" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">clear-cli run</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="60" x2="640" y2="60" stroke="url(#arrow)" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="638,54 648,60 638,66" fill="#22d3ee"/>

  <!-- Box 4: Output -->
  <rect x="650" y="15" width="135" height="90" rx="10" fill="url(#box1)" stroke="#334155" stroke-width="1"/>
  <text x="717" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">REST API</text>
  <text x="717" y="62" font-family="'Courier New', monospace" font-size="10" fill="#60a5fa" text-anchor="middle">/api/tasks</text>
  <text x="717" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Web UI</text>
  <text x="717" y="98" font-family="'Courier New', monospace" font-size="10" fill="#60a5fa" text-anchor="middle">/s/dashboard</text>
</svg>
